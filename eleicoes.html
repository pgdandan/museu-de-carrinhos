<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root {
  --fundo: #0b1220;
  --painel: #121b2e;
  --painel2: #1a2540;
  --linha: #26324f;
  --texto: #eef2fb;
  --suave: #93a0bd;
  --destaque: #ffd23f;
  --ok: #2ecc71;
  --erro: #ff6b6b;
  --c1: #3b82f6;
  --c2: #ef4444;
  --raio: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fundo);
  color: var(--texto);
  font: 18px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
button {
  font: inherit; color: inherit; cursor: pointer;
  border: 0; border-radius: 14px;
  background: var(--painel2);
  min-height: 56px; padding: 0 18px;
  touch-action: manipulation;
}
button:active { transform: scale(.97); filter: brightness(1.2); }
button.ativo { background: var(--destaque); color: #111; font-weight: 700; }
button:disabled { opacity: .35; }

.app {
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: 100dvh;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  gap: 10px;
}

/* topo */
.topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topo h1 { font-size: 22px; margin: 0 8px 0 4px; white-space: nowrap; }
.topo h1 small { display: block; font-size: 13px; color: var(--suave); font-weight: 500; }
.cargos { display: flex; background: var(--painel); border-radius: 16px; padding: 4px; gap: 4px; }
.cargos button { min-width: 140px; background: transparent; font-size: 19px; }
.cargos button.ativo { background: var(--destaque); }
.espaco { flex: 1; }
.status { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 15px; }
.anel { width: 44px; height: 44px; }
.anel circle { fill: none; stroke-width: 5; }
.icone { min-width: 56px; font-size: 24px; padding: 0; }
.selo-demo { background: #7c3aed; color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 700; display: none; }
body.demo .selo-demo { display: inline-block; }

/* trilha */
.trilha { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.trilha button { white-space: nowrap; font-size: 18px; min-height: 48px; }
.trilha .sep { color: var(--suave); }

/* corpo */
.corpo { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 12px; min-height: 0; }
.corpo > * { min-width: 0; }
.caixa { background: var(--painel); border-radius: var(--raio); padding: 14px; min-height: 0; }

/* seletor */
.seletor { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.seletor h2 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); }
.ufs { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.ufs button { padding: 0; font-weight: 700; font-size: 18px; min-height: 50px; }
.busca { display: flex; gap: 8px; }
.busca input {
  flex: 1; min-width: 0; font: inherit; font-size: 20px; color: var(--texto);
  background: var(--fundo); border: 2px solid var(--linha); border-radius: 14px;
  padding: 0 16px; min-height: 56px; outline: none;
}
.busca input:focus { border-color: var(--destaque); }
.letras { display: flex; flex-wrap: wrap; gap: 6px; }
.letras button { min-height: 44px; min-width: 44px; padding: 0; font-size: 17px; }
.cidades { overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
.cidades button { text-align: left; font-size: 19px; flex-shrink: 0; }
.vazio { color: var(--suave); padding: 12px 4px; }

/* resultado */
.resultado { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.cabeca { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.cabeca h2 { margin: 0; font-size: clamp(26px, 3.4vw, 42px); line-height: 1.1; }
.cabeca .sub { color: var(--suave); font-size: 16px; }
.apuradas { text-align: right; }
.apuradas b { font-size: clamp(30px, 4vw, 48px); color: var(--destaque); display: block; line-height: 1; }
.barra-sec { height: 14px; background: var(--fundo); border-radius: 99px; overflow: hidden; }
.barra-sec i { display: block; height: 100%; background: var(--destaque); width: 0; transition: width .8s; }

.cands { display: flex; flex-direction: column; gap: 12px; }
.cand {
  display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center;
  background: var(--painel2); border-radius: var(--raio); padding: 14px 18px;
  border-left: 8px solid var(--cor);
}
.foto { width: 96px; height: 96px; border-radius: 50%; background: var(--fundo) center/cover; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: var(--cor); overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.cand .nome { font-size: clamp(22px, 2.6vw, 32px); font-weight: 800; line-height: 1.1; }
.cand .partido { color: var(--suave); font-size: 16px; margin-top: 2px; }
.cand .barra { height: 16px; background: var(--fundo); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.cand .barra i { display: block; height: 100%; background: var(--cor); width: 0; transition: width .8s; }
.cand .num { text-align: right; }
.cand .pct { font-size: clamp(34px, 5vw, 60px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cand .votos { color: var(--suave); font-size: 16px; font-variant-numeric: tabular-nums; }
.eleito { display: inline-block; background: var(--ok); color: #062; font-weight: 800; font-size: 14px; padding: 3px 10px; border-radius: 8px; margin-left: 8px; vertical-align: middle; }

.dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.dado { background: var(--painel2); border-radius: 14px; padding: 12px 14px; }
.dado span { color: var(--suave); font-size: 14px; display: block; }
.dado b { font-size: 24px; font-variant-numeric: tabular-nums; }
.dado small { color: var(--suave); font-size: 14px; margin-left: 4px; }

.aviso { background: var(--painel2); border-radius: var(--raio); padding: 24px; text-align: center; font-size: 20px; color: var(--suave); }
.aviso b { color: var(--texto); display: block; font-size: 24px; margin-bottom: 6px; }
.aviso button { margin-top: 16px; }
.erro-linha { color: var(--erro); font-size: 15px; }

/* configurações */
dialog { background: var(--painel); color: var(--texto); border: 0; border-radius: 22px; padding: 22px; width: min(560px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h3 { margin: 0 0 12px; }
dialog label { display: block; color: var(--suave); font-size: 15px; margin: 12px 0 4px; }
dialog input { width: 100%; font: inherit; font-size: 20px; color: var(--texto); background: var(--fundo); border: 2px solid var(--linha); border-radius: 12px; padding: 12px; }
dialog .linha { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
dialog p { color: var(--suave); font-size: 15px; margin: 8px 0; }

/* retrato / celular */
@media (max-width: 860px) {
  .corpo { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow-y: auto; }
  .caixa { min-height: auto; }
  .seletor { overflow: visible; }
  .cidades { flex: none; }
  .resultado { overflow: visible; }
  .apuradas { text-align: left; }
  #horaAtual { display: none; }
  .ufs { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
  .seletor { max-height: none; }
  .cidades { max-height: 40vh; }
  .cargos button { min-width: 0; flex: 1; }
  .cargos { flex: 1; }
  .topo h1 { width: 100%; }
  .cand { grid-template-columns: 64px 1fr; }
  .foto { width: 64px; height: 64px; font-size: 24px; }
  .cand .num { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; text-align: left; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <h1>Apuração 2º turno<small id="dataEleicao">Resultados do TSE</small></h1>
    <div class="cargos" role="tablist">
      <button id="btPres" class="ativo" data-cargo="pres">Presidente</button>
      <button id="btGov" data-cargo="gov">Governador</button>
    </div>
    <span class="espaco"></span>
    <span class="selo-demo">DEMONSTRAÇÃO</span>
    <div class="status">
      <span id="horaAtual">—</span>
      <svg class="anel" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="18" stroke="#26324f"/>
        <circle id="anelProg" cx="22" cy="22" r="18" stroke="#ffd23f" stroke-dasharray="113" stroke-dashoffset="0" transform="rotate(-90 22 22)"/>
      </svg>
    </div>
    <button class="icone" id="btAtualizar" title="Atualizar agora">⟳</button>
    <button class="icone" id="btTela" title="Tela cheia">⛶</button>
    <button class="icone" id="btCompartilhar" title="Compartilhar">↗</button>
    <button class="icone" id="btConfig" title="Configurações">⚙</button>
  </header>

  <nav class="trilha" id="trilha"></nav>

  <main class="corpo">
    <section class="caixa seletor">
      <h2>Estado</h2>
      <div class="ufs" id="ufs"></div>
      <h2 id="tituloCidades">Cidade</h2>
      <div class="busca">
        <input id="busca" type="search" placeholder="Buscar cidade…" autocomplete="off" enterkeyhint="search">
        <button class="icone" id="btLimpar" title="Limpar busca">✕</button>
      </div>
      <div class="letras" id="letras"></div>
      <div class="cidades" id="cidades"><div class="vazio">Escolha um estado para ver as cidades.</div></div>
    </section>

    <section class="caixa resultado" id="resultado"></section>
  </main>
</div>

<dialog id="dlgConfig">
  <h3>Configurações</h3>
  <p>O painel descobre sozinho os códigos das eleições do 2º turno no TSE. Se a detecção falhar, preencha à mão (o código aparece na URL do site resultados.tse.jus.br).</p>
  <label for="cfAno">Ano</label>
  <input id="cfAno" inputmode="numeric">
  <label for="cfFed">Código da eleição federal — Presidente</label>
  <input id="cfFed" inputmode="numeric" placeholder="automático">
  <label for="cfEst">Código da eleição estadual — Governador</label>
  <input id="cfEst" inputmode="numeric" placeholder="automático">
  <label for="cfIntervalo">Atualizar a cada (segundos)</label>
  <input id="cfIntervalo" inputmode="numeric">
  <p id="cfInfo"></p>
  <div class="linha">
    <button class="ativo" id="cfSalvar">Salvar</button>
    <button id="cfDetectar">Detectar de novo</button>
    <button id="cfDemo">Modo demonstração</button>
    <button id="cfFechar">Fechar</button>
  </div>
</dialog>

<script>
"use strict";

// ---------- constantes ----------
const UFS = [
  ["AC","Acre"],["AL","Alagoas"],["AP","Amapá"],["AM","Amazonas"],["BA","Bahia"],["CE","Ceará"],
  ["DF","Distrito Federal"],["ES","Espírito Santo"],["GO","Goiás"],["MA","Maranhão"],["MT","Mato Grosso"],
  ["MS","Mato Grosso do Sul"],["MG","Minas Gerais"],["PA","Pará"],["PB","Paraíba"],["PR","Paraná"],
  ["PE","Pernambuco"],["PI","Piauí"],["RJ","Rio de Janeiro"],["RN","Rio Grande do Norte"],
  ["RS","Rio Grande do Sul"],["RO","Rondônia"],["RR","Roraima"],["SC","Santa Catarina"],
  ["SP","São Paulo"],["SE","Sergipe"],["TO","Tocantins"],
];
const NOME_UF = Object.fromEntries(UFS);
const CARGO = { pres: "0001", gov: "0003" };
const CORES = ["#3b82f6", "#ef4444", "#22c55e", "#f59e0b", "#a855f7", "#14b8a6"];
const TSE = "https://resultados.tse.jus.br/oficial/";

// ---------- estado ----------
const guardado = ler("painel-eleicoes", {});
// 6258 = "Eleição Ordinária Federal - 2026 2º Turno" (ele-c.json do TSE);
// fica de reserva caso a detecção automática não responda
const FED_PADRAO = "6258";
const cfg = Object.assign({ ano: 2026, fed: "", est: "", pleito: "", intervalo: 30, demo: false }, guardado.cfg);
if (!cfg.fed && Number(cfg.ano) === 2026) cfg.fed = FED_PADRAO;
const est = {
  cargo: guardado.cargo || "pres",
  uf: guardado.uf || null,
  mun: guardado.mun || null,     // { cd, nm }
  letra: null,
  municipios: {},                // uf -> [{cd, nm}]
  ultimo: null,
  proxima: 0,
  carregando: false,
};

function ler(chave, padrao) {
  try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; }
}
function salvar() {
  try {
    localStorage.setItem("painel-eleicoes", JSON.stringify({
      cfg, cargo: est.cargo, uf: est.uf, mun: est.mun,
    }));
  } catch {}
}
const $ = (id) => document.getElementById(id);
const pad = (n, t) => String(n).padStart(t, "0");
const num = (v) => {
  if (v == null || v === "") return null;
  const n = parseFloat(String(v).replace(/\./g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
};
const pctNum = (v) => {
  if (v == null || v === "") return null;
  const n = parseFloat(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : null;
};
const fmtInt = (n) => n == null ? "—" : Math.round(n).toLocaleString("pt-BR");
const fmtPct = (n) => n == null ? "—" : n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
const semAcento = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- acesso ao TSE ----------
// Tenta primeiro o proxy do próprio site (/api/tse, com cache) e,
// se não existir (arquivo aberto direto), vai direto no TSE.
async function tse(caminho) {
  const tentativas = [];
  if (location.protocol.startsWith("http")) tentativas.push("/api/tse?p=" + encodeURIComponent(caminho));
  tentativas.push(TSE + caminho + "?t=" + Math.floor(Date.now() / 10000));
  let ultimoErro;
  for (const url of tentativas) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.status === 404 || r.status === 403) { ultimoErro = new Error("nao-encontrado"); continue; }
      if (!r.ok) { ultimoErro = new Error("HTTP " + r.status); continue; }
      return await r.json();
    } catch (e) { ultimoErro = e; }
  }
  throw ultimoErro || new Error("falha");
}

// Descobre os códigos das eleições do 2º turno no arquivo de configuração geral.
async function detectarEleicoes() {
  const j = await tse("comum/config/ele-c.json");
  const achadas = [];
  (function andar(o, pleito) {
    if (Array.isArray(o)) return o.forEach((x) => andar(x, pleito));
    if (!o || typeof o !== "object") return;
    const nm = String(o.nm || o.ds || "");
    const dt = String(o.dt || "");
    if (o.cd && /^\d{3,6}$/.test(String(o.cd)) && /elei/i.test(nm)) {
      achadas.push({ cd: String(Number(o.cd)), nm, dt, t: String(o.t ?? o.tu ?? ""), pleito });
    }
    // os pleitos (pl) agrupam as eleições do mesmo dia
    const proprio = Array.isArray(o.e) && o.cd ? String(Number(o.cd)) : pleito;
    Object.values(o).forEach((x) => andar(x, proprio));
  })(j, "");
  const doAno = achadas.filter((e) => e.nm.includes(cfg.ano) || e.dt.includes(cfg.ano));
  const segundo = doAno.filter((e) => e.t === "2" || /2[ºo°]\s*turno/i.test(e.nm));
  const fed = segundo.find((e) => /federal/i.test(e.nm));
  const estd = segundo.find((e) => /estadua/i.test(e.nm));
  if (fed) cfg.fed = fed.cd;
  if (estd) cfg.est = estd.cd;
  const pleito = (fed || estd || {}).pleito;
  if (pleito) cfg.pleito = pleito;
  const data = (fed || estd || {}).dt;
  if (data) $("dataEleicao").textContent = "Eleição de " + data + " · TSE";
  salvar();
  return { fed, estd };
}

function codigoEleicao() {
  return est.cargo === "pres" ? cfg.fed : cfg.est;
}

function caminhoResultado() {
  const ele = codigoEleicao();
  const e6 = pad(ele, 6);
  const c = CARGO[est.cargo];
  let pasta, arq;
  if (!est.uf) { pasta = "br"; arq = "br"; }
  else if (!est.mun) { pasta = est.uf.toLowerCase(); arq = pasta; }
  else { pasta = est.uf.toLowerCase(); arq = pasta + pad(Number(est.mun.cd), 5); }
  return `ele${cfg.ano}/${ele}/dados/${pasta}/${arq}-c${c}-e${e6}-u.json`;
}

// Em 2026 o TSE publica o resultado unificado "-u.json" na pasta dados/;
// até 2024 era "-r.json" em dados-simplificados/. Tenta o novo e cai no antigo.
async function buscarResultado(caminho) {
  try {
    return await tse(caminho);
  } catch (e) {
    if (e.message !== "nao-encontrado") throw e;
    return await tse(caminho.replace("/dados/", "/dados-simplificados/").replace(/-u\.json$/, "-r.json"));
  }
}

async function carregarMunicipios(uf) {
  if (est.municipios[uf]) return est.municipios[uf];
  if (cfg.demo) {
    est.municipios[uf] = demoMunicipios(uf);
    return est.municipios[uf];
  }
  // a lista de cidades vem da eleição federal (todos os municípios votam para presidente).
  // Primeiro o arquivo de municípios da eleição; se não existir, a configuração
  // das urnas do pleito, que lista os municípios do estado.
  const ele = cfg.fed || cfg.est;
  const u = uf.toLowerCase();
  const fontes = [`ele${cfg.ano}/${ele}/config/mun-e${pad(ele, 6)}-cm.json`];
  for (const pl of new Set([cfg.pleito, "3221", "3220"].filter(Boolean))) {
    fontes.push(`ele${cfg.ano}/arquivo-urna/${pl}/config/${u}/${u}-p${pad(pl, 6)}-cs.json`);
  }
  let j, erro;
  for (const f of fontes) {
    try { j = await tse(f); break; } catch (e) { erro = e; }
  }
  if (!j) throw erro;
  const todos = {};
  const abr = j.abr || [];
  for (const a of abr) {
    const sigla = abr.length === 1 && !NOME_UF[String(a.cd || "").toUpperCase()]
      ? uf : String(a.cd || "").toUpperCase();
    if (!NOME_UF[sigla]) continue;
    todos[sigla] = (a.mu || []).map((m) => ({ cd: pad(Number(m.cd), 5), nm: String(m.nm).trim() }))
      .sort((x, y) => x.nm.localeCompare(y.nm, "pt-BR"));
  }
  Object.assign(est.municipios, todos);
  return est.municipios[uf] || [];
}

// Lê o JSON "dados-simplificados" do TSE de forma tolerante a pequenas
// mudanças de formato entre uma eleição e outra.
function interpretar(j) {
  const s = j.s || {}, e = j.e || {}, v = j.v || {};
  const cands = [];
  (function andar(o, partido) {
    if (Array.isArray(o)) return o.forEach((x) => andar(x, partido));
    if (!o || typeof o !== "object") return;
    if ("vap" in o && (o.nm || o.nmu || o.n)) { cands.push(Object.assign({ _sg: partido }, o)); return; }
    const sg = Array.isArray(o.cand) && o.sg ? o.sg : partido;
    Object.values(o).forEach((x) => andar(x, sg));
  })(j.carg || j.cand || j, "");
  const lista = cands.map((c) => ({
    nome: c.nmu || c.nm || ("Nº " + c.n),
    numero: c.n,
    partido: c._sg || c.sg || c.cc || "",
    votos: num(c.vap),
    pct: pctNum(c.pvapn != null && c.pvapn !== "" ? c.pvapn : c.pvap),
    eleito: c.e === "s" || /^eleito/i.test(String(c.st || "")),
    sq: c.sqcand,
  })).sort((a, b) => (b.votos ?? 0) - (a.votos ?? 0));
  return {
    cands: lista,
    secoesPct: pctNum(s.pst),
    secoes: num(s.st), secoesTotal: num(s.ts),
    eleitorado: num(e.te),
    comparec: num(e.c), comparecPct: pctNum(e.pc),
    abst: num(e.a), abstPct: pctNum(e.pa),
    brancos: num(v.vb), brancosPct: pctNum(v.pvb),
    nulos: num(v.tvn ?? v.vn), nulosPct: pctNum(v.ptvn ?? v.pvn),
    validos: num(v.vv), validosPct: pctNum(v.pvv),
    geradoEm: [j.dg, j.hg].filter(Boolean).join(" "),
    totalizadoEm: [j.dt, j.ht].filter(Boolean).join(" "),
    matematico: j.md === "e" || j.md === "s",
  };
}

// ---------- demonstração ----------
function semente(str) {
  let h = 2166136261;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0) % 10000) / 10000;
}
function demoMunicipios(uf) {
  const r = semente("mun" + uf);
  const partes = ["São", "Santa", "Nova", "Bom", "Porto", "Vila", "Campo", "Rio", "Monte", "Serra", "Lagoa", "Barra"];
  const fins = ["Jesus", "Esperança", "Alegre", "Grande", "Verde", "Bonito", "Formoso", "do Sul", "do Norte", "da Mata", "das Flores", "Velho"];
  const lista = new Set([NOME_UF[uf] === "Distrito Federal" ? "Brasília" : "Capital " + uf]);
  const n = uf === "DF" ? 1 : 25 + Math.floor(r() * 40);
  while (lista.size < n) lista.add(partes[Math.floor(r() * partes.length)] + " " + fins[Math.floor(r() * fins.length)]);
  return [...lista].map((nm, i) => ({ cd: String(10000 + i * 17), nm: nm.toUpperCase() }))
    .sort((a, b) => a.nm.localeCompare(b.nm, "pt-BR"));
}
const inicioDemo = Date.now();
function demoResultado() {
  const chave = est.cargo + (est.uf || "BR") + (est.mun?.cd || "");
  const r = semente(chave);
  const eleitorado = !est.uf ? 156e6 : !est.mun ? 2e6 + r() * 30e6 : 5e3 + r() * 9e5;
  const avanco = Math.min(1, 0.05 + (Date.now() - inicioDemo) / 1000 / 600); // completa em ~10 min
  const comparecPct = 0.76 + r() * 0.08;
  const comparec = eleitorado * comparecPct * avanco;
  const brancos = comparec * (0.01 + r() * 0.02), nulos = comparec * (0.02 + r() * 0.03);
  const validos = comparec - brancos - nulos;
  const fatia = 0.35 + r() * 0.3 + Math.sin(avanco * 3 + r() * 6) * 0.02;
  const nomes = est.cargo === "pres"
    ? [["CANDIDATO A", "10", "PARTIDO A"], ["CANDIDATO B", "20", "PARTIDO B"]]
    : [["CANDIDATO C", "30", "PARTIDO C"], ["CANDIDATO D", "40", "PARTIDO D"]];
  const cands = nomes.map(([nome, numero, partido], i) => {
    const p = i === 0 ? fatia : 1 - fatia;
    return { nome, numero, partido, votos: validos * p, pct: p * 100, eleito: avanco >= 1 && p > 0.5 };
  }).sort((a, b) => b.votos - a.votos);
  const agora = new Date();
  return {
    cands, secoesPct: avanco * 100,
    eleitorado, comparec, comparecPct: comparecPct * 100,
    abst: eleitorado * avanco - comparec, abstPct: (1 - comparecPct) * 100,
    brancos, brancosPct: brancos / comparec * 100, nulos, nulosPct: nulos / comparec * 100,
    validos, validosPct: validos / comparec * 100,
    geradoEm: agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR"),
  };
}

// ---------- tela ----------
function desenharUFs() {
  $("ufs").innerHTML = UFS.map(([s, n]) =>
    `<button data-uf="${s}" title="${n}" class="${est.uf === s ? "ativo" : ""}">${s}</button>`).join("");
}

function desenharTrilha() {
  const partes = [];
  partes.push(`<button data-ir="br" class="${!est.uf ? "ativo" : ""}" ${est.cargo === "gov" ? "disabled" : ""}>🇧🇷 Brasil</button>`);
  if (est.uf) {
    partes.push(`<span class="sep">›</span><button data-ir="uf" class="${!est.mun ? "ativo" : ""}">${esc(NOME_UF[est.uf])}</button>`);
  }
  if (est.mun) {
    partes.push(`<span class="sep">›</span><button class="ativo">${esc(est.mun.nm)}</button>`);
  }
  $("trilha").innerHTML = partes.join("");
}

async function desenharCidades() {
  const caixa = $("cidades");
  $("tituloCidades").textContent = est.uf ? "Cidades de " + NOME_UF[est.uf] : "Cidade";
  if (!est.uf) {
    $("letras").innerHTML = "";
    caixa.innerHTML = `<div class="vazio">Escolha um estado para ver as cidades.</div>`;
    return;
  }
  let lista;
  try {
    caixa.innerHTML = `<div class="vazio">Carregando cidades…</div>`;
    lista = await carregarMunicipios(est.uf);
  } catch (e) {
    caixa.innerHTML = `<div class="vazio">Não foi possível carregar as cidades agora.<br><span class="erro-linha">${esc(e.message)}</span></div>`;
    return;
  }
  const iniciais = [...new Set(lista.map((m) => semAcento(m.nm)[0]))].sort();
  $("letras").innerHTML = iniciais.map((l) =>
    `<button data-letra="${l}" class="${est.letra === l ? "ativo" : ""}">${l}</button>`).join("");
  const termo = semAcento($("busca").value.trim());
  let filtrada = lista;
  if (termo) filtrada = lista.filter((m) => semAcento(m.nm).includes(termo));
  else if (est.letra) filtrada = lista.filter((m) => semAcento(m.nm)[0] === est.letra);
  const max = 250;
  caixa.innerHTML = filtrada.length
    ? filtrada.slice(0, max).map((m) =>
        `<button data-mun="${esc(m.cd)}" class="${est.mun?.cd === m.cd ? "ativo" : ""}">${esc(m.nm)}</button>`).join("")
      + (filtrada.length > max ? `<div class="vazio">+${filtrada.length - max} cidades — use a busca ou as letras.</div>` : "")
    : `<div class="vazio">Nenhuma cidade encontrada.</div>`;
}

function nomeLocal() {
  if (est.mun) return est.mun.nm + " – " + est.uf;
  if (est.uf) return NOME_UF[est.uf];
  return "Brasil";
}

function iniciaisNome(n) {
  return n.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join("");
}

function fotoUrl(c) {
  if (cfg.demo || !c.sq) return "";
  const ele = codigoEleicao();
  const pasta = est.cargo === "pres" ? "br" : est.uf.toLowerCase();
  return `${TSE}ele${cfg.ano}/${ele}/fotos/${pasta}/${c.sq}.jpeg`;
}

function desenharResultado(d) {
  const titulo = (est.cargo === "pres" ? "Presidente" : "Governador") + " · " + nomeLocal();
  const total = d.cands.reduce((s, c) => s + (c.votos || 0), 0) || 1;
  const cands = d.cands.map((c, i) => {
    const pct = c.pct ?? (c.votos / total * 100);
    const foto = fotoUrl(c);
    return `<div class="cand" style="--cor:${CORES[i % CORES.length]}">
      <div class="foto">${foto ? `<img src="${esc(foto)}" alt="" onerror="this.remove()">` : ""}${esc(iniciaisNome(c.nome))}</div>
      <div>
        <div class="nome">${esc(c.nome)}${c.eleito ? '<span class="eleito">ELEITO</span>' : ""}</div>
        <div class="partido">${c.numero ? esc(c.numero) + " · " : ""}${esc(c.partido)}</div>
        <div class="barra"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>
      </div>
      <div class="num"><div class="pct">${fmtPct(pct)}</div><div class="votos">${fmtInt(c.votos)} votos</div></div>
    </div>`;
  }).join("");
  $("resultado").innerHTML = `
    <div class="cabeca">
      <div><h2>${esc(titulo)}</h2>
        <div class="sub">${d.geradoEm ? "Atualizado pelo TSE em " + esc(d.geradoEm) : ""}${d.matematico ? " · resultado matematicamente definido" : ""}</div></div>
      <div class="apuradas"><span class="sub">Seções apuradas</span><b>${fmtPct(d.secoesPct)}</b></div>
    </div>
    <div class="barra-sec"><i style="width:${d.secoesPct ?? 0}%"></i></div>
    <div class="cands">${cands || '<div class="aviso">Ainda sem votos apurados.</div>'}</div>
    <div class="dados">
      <div class="dado"><span>Válidos</span><b>${fmtInt(d.validos)}</b><small>${fmtPct(d.validosPct)}</small></div>
      <div class="dado"><span>Brancos</span><b>${fmtInt(d.brancos)}</b><small>${fmtPct(d.brancosPct)}</small></div>
      <div class="dado"><span>Nulos</span><b>${fmtInt(d.nulos)}</b><small>${fmtPct(d.nulosPct)}</small></div>
      <div class="dado"><span>Comparecimento</span><b>${fmtInt(d.comparec)}</b><small>${fmtPct(d.comparecPct)}</small></div>
      <div class="dado"><span>Abstenção</span><b>${fmtInt(d.abst)}</b><small>${fmtPct(d.abstPct)}</small></div>
      <div class="dado"><span>Eleitorado</span><b>${fmtInt(d.eleitorado)}</b></div>
    </div>`;
}

function aviso(titulo, texto, botao) {
  $("resultado").innerHTML = `<div class="aviso"><b>${esc(titulo)}</b>${esc(texto)}${botao || ""}</div>`;
}

// ---------- ciclo de atualização ----------
async function atualizar() {
  if (est.carregando) return;
  agendar();
  if (est.cargo === "gov" && !est.uf) {
    aviso("Escolha um estado", "O governador é eleito por estado. Toque numa sigla ao lado.");
    return;
  }
  if (cfg.demo) { desenharResultado(demoResultado()); return; }
  if (!codigoEleicao()) {
    aviso("Eleição não encontrada",
      "Não consegui descobrir o código da eleição no TSE. Abra as configurações para tentar de novo ou preencher à mão.",
      `<br><button class="ativo" onclick="abrirConfig()">Abrir configurações</button>`);
    return;
  }
  est.carregando = true;
  const chave = caminhoResultado();
  try {
    const j = await buscarResultado(chave);
    if (chave !== caminhoResultado()) return; // usuário trocou de local no meio
    est.ultimo = interpretar(j);
    desenharResultado(est.ultimo);
  } catch (e) {
    if (chave !== caminhoResultado()) return;
    if (e.message === "nao-encontrado" && antesDaApuracao()) {
      aviso("A apuração começa às 17h", "Horário de Brasília. O painel mostra os números sozinho assim que o TSE publicar.");
    } else if (e.message === "nao-encontrado") {
      aviso(est.cargo === "gov" ? "Sem 2º turno para governador aqui" : "Resultado ainda não publicado",
        est.cargo === "gov"
          ? "Este estado não tem 2º turno para governador, ou o TSE ainda não publicou os dados."
          : "O TSE ainda não publicou dados para este local. O painel tenta de novo sozinho.");
    } else if (est.ultimo) {
      // mantém o último resultado na tela e só avisa
      const sub = document.querySelector(".cabeca .sub");
      if (sub) sub.innerHTML += ` <span class="erro-linha">· sem conexão, tentando de novo</span>`;
    } else {
      aviso("Sem conexão com o TSE", "Tentando de novo em instantes. Verifique a internet do aparelho.");
    }
  } finally {
    est.carregando = false;
  }
}

let timer;
function agendar() {
  clearTimeout(timer);
  const ms = Math.max(10, Number(cfg.intervalo) || 30) * 1000;
  est.proxima = Date.now() + ms;
  timer = setTimeout(atualizar, ms);
}

setInterval(() => {
  $("horaAtual").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const ms = Math.max(10, Number(cfg.intervalo) || 30) * 1000;
  const falta = Math.max(0, est.proxima - Date.now());
  $("anelProg").setAttribute("stroke-dashoffset", String(113 * (1 - falta / ms)));
}, 250);

// antes das 17h de Brasília do dia do 2º turno ainda não há arquivo no TSE
function antesDaApuracao() {
  const partes = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  const hoje = `${partes.year}-${partes.month}-${partes.day}`;
  return hoje < "2026-10-25" || (hoje === "2026-10-25" && Number(partes.hour) < 17);
}

// ---------- endereço (#presidente, #presidente/sp, #presidente/sp/62910, #governador/sp) ----------
function hashAtual() {
  const partes = [est.cargo === "gov" ? "governador" : "presidente"];
  if (est.uf) partes.push(est.uf.toLowerCase());
  if (est.uf && est.mun) partes.push(est.mun.cd);
  return "#" + partes.join("/");
}
function gravarHash() {
  if (location.hash !== hashAtual()) history.replaceState(null, "", hashAtual());
}
// devolve true se o endereço trouxe um local
async function lerHash() {
  const [cargo, uf, mun] = decodeURIComponent(location.hash.slice(1)).toLowerCase().split("/");
  if (cargo !== "presidente" && cargo !== "governador") return false;
  est.cargo = cargo === "governador" ? "gov" : "pres";
  $("btPres").classList.toggle("ativo", est.cargo === "pres");
  $("btGov").classList.toggle("ativo", est.cargo === "gov");
  const sigla = (uf || "").toUpperCase();
  est.uf = NOME_UF[sigla] ? sigla : null;
  est.mun = null;
  if (est.uf && mun) {
    try {
      const lista = await carregarMunicipios(est.uf);
      est.mun = lista.find((m) => Number(m.cd) === Number(mun)) || null;
    } catch {}
  }
  return true;
}
window.addEventListener("hashchange", async () => {
  if (location.hash === hashAtual()) return;
  if (await lerHash()) { mudouLocal(); desenharCidades(); }
});

const SITE = "https://seuimposto.com/";
$("btCompartilhar").addEventListener("click", async () => {
  const base = location.protocol.startsWith("http") ? location.origin + location.pathname : SITE;
  const url = base + hashAtual();
  const texto = "Lula × Flávio. A apuração do 2º turno começa às 17h.\nAcompanhe ao vivo, estado por estado:";
  try {
    if (navigator.share) { await navigator.share({ title: "Apuração 2º turno", text: texto, url }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText(texto + " " + url);
    $("btCompartilhar").textContent = "✓";
    setTimeout(() => { $("btCompartilhar").textContent = "↗"; }, 2000);
  } catch {
    prompt("Copie o link:", url);
  }
});

function mudouLocal() {
  est.ultimo = null;
  salvar();
  gravarHash();
  desenharUFs();
  desenharTrilha();
  aviso("Carregando…", nomeLocal());
  atualizar();
}

// ---------- eventos ----------
document.querySelector(".cargos").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-cargo]");
  if (!b || est.cargo === b.dataset.cargo) return;
  est.cargo = b.dataset.cargo;
  $("btPres").classList.toggle("ativo", est.cargo === "pres");
  $("btGov").classList.toggle("ativo", est.cargo === "gov");
  mudouLocal();
});

$("ufs").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-uf]");
  if (!b) return;
  est.uf = b.dataset.uf;
  est.mun = null;
  est.letra = null;
  $("busca").value = "";
  mudouLocal();
  desenharCidades();
});

$("letras").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-letra]");
  if (!b) return;
  est.letra = est.letra === b.dataset.letra ? null : b.dataset.letra;
  $("busca").value = "";
  desenharCidades();
});

$("cidades").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-mun]");
  if (!b) return;
  const m = (est.municipios[est.uf] || []).find((x) => x.cd === b.dataset.mun);
  if (!m) return;
  est.mun = m;
  mudouLocal();
  desenharCidades();
  if (matchMedia("(max-width: 860px)").matches) $("resultado").scrollIntoView({ behavior: "smooth" });
});

$("busca").addEventListener("input", () => { est.letra = null; desenharCidades(); });
$("btLimpar").addEventListener("click", () => { $("busca").value = ""; est.letra = null; desenharCidades(); });

$("trilha").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-ir]");
  if (!b) return;
  if (b.dataset.ir === "br") { est.uf = null; est.mun = null; }
  if (b.dataset.ir === "uf") { est.mun = null; }
  mudouLocal();
  desenharCidades();
});

$("btAtualizar").addEventListener("click", atualizar);

$("btTela").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});

// mantém a tela acesa enquanto o painel estiver aberto
let trava;
async function manterAcesa() {
  try { trava = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { manterAcesa(); atualizar(); }
});

// configurações
function abrirConfig() {
  $("cfAno").value = cfg.ano;
  $("cfFed").value = cfg.fed;
  $("cfEst").value = cfg.est;
  $("cfIntervalo").value = cfg.intervalo;
  $("cfDemo").textContent = cfg.demo ? "Sair da demonstração" : "Modo demonstração";
  $("cfInfo").textContent = cfg.fed || cfg.est
    ? `Em uso: federal ${cfg.fed || "—"}, estadual ${cfg.est || "—"}.` : "Nenhum código detectado ainda.";
  $("dlgConfig").showModal();
}
window.abrirConfig = abrirConfig;
$("btConfig").addEventListener("click", abrirConfig);
$("cfFechar").addEventListener("click", () => $("dlgConfig").close());
$("cfSalvar").addEventListener("click", () => {
  cfg.ano = Number($("cfAno").value) || cfg.ano;
  cfg.fed = $("cfFed").value.trim().replace(/\D/g, "");
  cfg.est = $("cfEst").value.trim().replace(/\D/g, "");
  cfg.intervalo = Math.max(10, Number($("cfIntervalo").value) || 30);
  est.municipios = {};
  salvar();
  $("dlgConfig").close();
  desenharCidades();
  mudouLocal();
});
$("cfDetectar").addEventListener("click", async () => {
  $("cfInfo").textContent = "Consultando o TSE…";
  cfg.ano = Number($("cfAno").value) || cfg.ano;
  try {
    const { fed, estd } = await detectarEleicoes();
    $("cfFed").value = cfg.fed;
    $("cfEst").value = cfg.est;
    $("cfInfo").textContent = (fed || estd)
      ? `Encontrado: ${[fed?.nm, estd?.nm].filter(Boolean).join(" | ")}`
      : "O TSE ainda não listou o 2º turno deste ano.";
  } catch (e) {
    $("cfInfo").textContent = "Falha ao consultar o TSE: " + e.message;
  }
});
$("cfDemo").addEventListener("click", () => {
  cfg.demo = !cfg.demo;
  document.body.classList.toggle("demo", cfg.demo);
  est.municipios = {};
  if (cfg.demo && est.mun) est.mun = null;
  salvar();
  $("dlgConfig").close();
  desenharCidades();
  mudouLocal();
});

// ---------- início ----------
(async function iniciar() {
  document.body.classList.toggle("demo", cfg.demo);
  if (est.cargo === "gov") { $("btPres").classList.remove("ativo"); $("btGov").classList.add("ativo"); }
  desenharUFs();
  desenharTrilha();
  aviso("Conectando ao TSE…", "Buscando a configuração da eleição.");
  manterAcesa();
  if (!cfg.demo) {
    try { await detectarEleicoes(); } catch { /* usa os códigos já salvos */ }
  }
  if (await lerHash()) { desenharUFs(); desenharTrilha(); }
  gravarHash();
  desenharCidades();
  atualizar();
})();
</script>
